services:
  bot:
    build: .
    restart: unless-stopped
    # Forwards docker stop's SIGTERM to node so the bot shuts down cleanly.
    init: true
    env_file: .env
    # Overrides .env so the bot uses the Redis container below.
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
    depends_on:
      - redis

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  redis-data:
